<!DOCTYPE html>
<!-- update 20260709 -->
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ecolab 云端分组系统</title>
<!-- 引入Supabase JS SDK -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:system-ui,-apple-system}
body{background:#f5f7fa;padding:40px 16px;text-align:center}
.wrap{max-width:440px;margin:0 auto;background:#fff;padding:36px 24px;border-radius:18px;box-shadow:0 2px 16px rgba(0,0,0,0.07)}
h2{margin-bottom:28px;color:#111}
.input-row{display:flex;gap:6px;align-items:center;margin-bottom:14px}
#prefixInput{flex:1;padding:14px 16px;border:1px solid #ddd;border-radius:12px;font-size:16px;outline:none}
.suffix-tag{font-size:16px;color:#444}
#prefixInput:focus{border-color:#3671e9}
button{width:100%;padding:15px;border:none;border-radius:12px;font-size:16px;font-weight:600;color:#fff;cursor:pointer;margin:6px 0}
.btn-main{background:#2563eb}
.btn-red{background:#ef4444}
.btn-blue{background:#3b82f6}
.btn-dark{background:#222}
.btn-warning{background:#f59e0b}
.result-box{margin-top:24px;padding:22px;border-radius:14px;font-size:22px;font-weight:bold;display:none;color:#fff}
.tip{margin-top:16px;color:#666;font-size:14px}
.admin-block{margin-top:36px;padding-top:24px;border-top:1px solid #eee}
.record-list{margin-top:18px;text-align:left;max-height:300px;overflow:auto}
.record-item{padding:9px 0;border-bottom:1px solid #eee;font-size:14px}
.loading{color:#666;margin:10px 0}
</style>
</head>
<body>
<div class="wrap">
    <h2>Ecolab 红蓝云端分组</h2>
    <div class="input-row">
        <input id="prefixInput" placeholder="输入邮箱前缀" type="text">
        <span class="suffix-tag">@ecolab.com</span>
    </div>
    <button class="btn-main" id="submitBtn">获取分组</button>
    <div id="resultBox" class="result-box"></div>
    <div class="tip">
        1.仅数据库授权邮箱可参与；2.同一设备30分钟仅可分组一次
    </div>

    <div class="admin-block">
        <button class="btn-dark" id="viewRecordBtn">管理员查看全部云端记录</button>
        <button class="btn-warning" id="clearAllBtn">管理员全局重置所有分组</button>
        <div class="loading" id="loadingTip"></div>
        <div class="record-list" id="recordContainer"></div>
    </div>
</div>

<script>
// ====================== 【请替换成你自己的Supabase信息】 ======================
const SUPABASE_URL = "https://rsltfnxxwcrjsbdnnrbq.supabase.co";
const SUPABASE_ANON_KEY = "sb_publishable_sb_publishable_CSrutYhQrnJ_oQwfwMHX1w_GAz8_fFB";
const COOL_DOWN_MS = 30 * 60 * 1000; // 30分钟限制
// ===========================================================================

// 初始化Supabase客户端
const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

// 生成当前设备唯一标识（区分手机/电脑）
function getDeviceId(){
    let did = localStorage.getItem("group_device_id");
    if(!did){
        did = Math.random().toString(36).slice(2) + Date.now().toString(36);
        localStorage.setItem("group_device_id", did);
    }
    return did;
}
const DEVICE_ID = getDeviceId();

// 拼接完整邮箱
function getFullEmail(prefix){
    return prefix.trim().toLowerCase() + "@ecolab.com";
}

// 校验前缀是否在白名单
async function checkPrefixInAllow(prefix){
    const lowPre = prefix.trim().toLowerCase();
    const {data} = await supabase.from("allow_prefix").select("*").eq("prefix", lowPre);
    return data.length > 0 ? data[0] : null;
}

// 校验该设备30分钟内是否已提交过
async function checkDeviceCoolDown(){
    const now = Date.now();
    const {data} = await supabase
        .from("group_record")
        .select("last_submit_time")
        .eq("device_id", DEVICE_ID)
        .order("last_submit_time", {asc:false})
        .limit(1);
    if(data.length === 0) return true;
    const lastTime = data[0].last_submit_time;
    if(now - lastTime < COOL_DOWN_MS){
        const waitMin = Math.ceil((COOL_DOWN_MS - (now - lastTime)) / 60000);
        alert(`冷却未结束，还需等待${waitMin}分钟`);
        return false;
    }
    return true;
}

// 提交分组逻辑
document.getElementById("submitBtn").addEventListener("click", async ()=>{
    const prefix = document.getElementById("prefixInput").value.trim();
    if(!prefix){
        alert("请输入邮箱前缀");
        return;
    }
    document.getElementById("loadingTip").innerText = "校验邮箱权限中...";
    const allowInfo = await checkPrefixInAllow(prefix);
    if(!allowInfo){
        document.getElementById("loadingTip").innerText = "";
        alert("该邮箱未授权，无法参与分组");
        return;
    }
    // 校验冷却
    const canSubmit = await checkDeviceCoolDown();
    if(!canSubmit){
        document.getElementById("loadingTip").innerText = "";
        return;
    }
    document.getElementById("loadingTip").innerText = "分配分组中...";
    const fullMail = getFullEmail(prefix);
    const group = Math.random() > 0.5 ? "红组" : "蓝组";
    const nowTs = Date.now();
    // 写入云端数据库
    await supabase.from("group_record").insert([{
        email: fullMail,
        group_name: group,
        device_id: DEVICE_ID,
        last_submit_time: nowTs
    }]);
    document.getElementById("loadingTip").innerText = "";
    // 展示结果
    const resBox = document.getElementById("resultBox");
    resBox.style.display = "block";
    resBox.className = "result-box " + (group === "红组" ? "btn-red" : "btn-blue");
    resBox.innerText = `分配结果：${group}`;
});

// 管理员读取全部云端记录
document.getElementById("viewRecordBtn").addEventListener("click", async ()=>{
    const prefix = document.getElementById("prefixInput").value.trim().toLowerCase();
    const userInfo = await checkPrefixInAllow(prefix);
    if(!userInfo || !userInfo.is_admin){
        alert("仅管理员账号可查看全部记录");
        return;
    }
    document.getElementById("loadingTip").innerText = "正在加载云端全部记录...";
    const {data, error} = await supabase
        .from("group_record")
        .select("email,group_name,create_at")
        .order("create_at", {asc:false});
    document.getElementById("loadingTip").innerText = "";
    const container = document.getElementById("recordContainer");
    if(error){
        container.innerHTML = `<div class="record-item">读取失败：${error.message}</div>`;
        return;
    }
    if(data.length === 0){
        container.innerHTML = `<div class="record-item">暂无任何分组记录</div>`;
        return;
    }
    let html = "";
    data.forEach(item=>{
        const time = new Date(item.create_at).toLocaleString();
        html += `<div class="record-item">${time}｜${item.email}｜${item.group_name}</div>`;
    });
    container.innerHTML = html;
});

// 管理员全局重置（清空所有分组数据）
document.getElementById("clearAllBtn").addEventListener("click", async ()=>{
    const prefix = document.getElementById("prefixInput").value.trim().toLowerCase();
    const userInfo = await checkPrefixInAllow(prefix);
    if(!userInfo || !userInfo.is_admin){
        alert("仅管理员账号可全局重置");
        return;
    }
    if(!confirm("确认清空云端所有人员分组记录？此操作不可恢复")) return;
    document.getElementById("loadingTip").innerText = "正在清空云端数据...";
    await supabase.from("group_record").delete().neq("id",0);
    document.getElementById("loadingTip").innerText = "";
    document.getElementById("recordContainer").innerHTML = `<div class="record-item">已全局重置，所有分组记录清空</div>`;
});
</script>
</body>
</html>
